# Builds the Windows installer on GitHub's servers and publishes it as a release.
# Runs when a version tag (v0.5.0, v0.6.0...) is pushed, or by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: GlassDock __VERSION__
          releaseBody: |
            Download **GlassDock___VERSION___x64-setup.exe** below and run it.
            Windows may warn that the app isn't code-signed: choose **More info → Run anyway**.
          releaseDraft: false
          prerelease: false
